<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Степень с натуральным и целым показателями</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease-in-out;
        }

        .question-card:hover {
            transform: translateY(-2px);
        }

        .question-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .question-number {
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .options-container {
            margin-bottom: 16px;
        }

        .option-label {
            display: block;
            padding: 10px 14px;
            margin-bottom: 8px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .option-label:hover {
            background-color: #f3f4f6;
        }

        input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback.incorrect {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .final-btn-container {
            text-align: center;
            margin: 40px 0;
        }

        #final-btn {
            background-color: var(--success);
            font-size: 1.2rem;
            padding: 16px 32px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }

        #final-btn:hover {
            background-color: #059669;
        }

        #result-display {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: none;
            margin-bottom: 40px;
        }

        @media (max-width: 600px) {
            .question-card {
                padding: 16px;
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Тренажер по алгебре (7 класс)</h1>
        <p class="subtitle">Степень с натуральным и целым показателями. 50 заданий.</p>
    </header>

    <div id="questions-container">
        <!-- Сюда будут динамически загружены вопросы -->
    </div>

    <div class="final-btn-container">
        <button id="final-btn">Узнать общий результат</button>
    </div>

    <div id="result-display"></div>
</div>

        },

        },

        },
        {

        },
        {

            correctIndex: 1
        },
        {

            type: 'text',
            text: 'Вычислите: 25<sup>-2</sup> &middot; 5<sup>5</sup>',

        },
        {

            type: 'text',

        },
        {

        },
        {
            id: 45,

            text: 'Найдите значение выражения: (8<sup>5</sup> &middot; 4<sup>-2</sup>) : 32<sup>2</sup>',

        },

        {

            options: ['2<sup>4n+1</sup>', '2<sup>16n</sup>', '2<sup>4n+2</sup>', '4<sup>4n</sup>'],
            correctIndex: 2

            answers: ['-4']

            options: ['32', '16', '64', '128'],
            correctIndex: 2

    const container = document.getElementById('questions-container');
    const userAnswers = new Array(questions.length).fill(null);
    let score = 0;

    // Функция для генерации HTML каждого вопроса
    function renderQuestions() {
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `question-card-${q.id}`;

            let contentHTML = `
                <div class="question-header">
                    <div class="question-number">${q.id}</div>
                    <div>${q.text}</div>
                </div>
                <div class="options-container">
            `;

            if (q.type === 'radio') {
                q.options.forEach((opt, optIndex) => {
                    contentHTML += `
                        <label class="option-label">
                            <input type="radio" name="q${q.id}" value="${optIndex}">
                            ${opt}
                        </label>
                    `;
                });
            } else if (q.type === 'text') {
                contentHTML += `
                    <input type="text" id="input-q${q.id}" placeholder="Введите ответ...">
                `;
            }

            contentHTML += `
                </div>
                <button id="btn-check-${q.id}" onclick="checkAnswer(${index})">Проверить</button>
                <div id="feedback-${q.id}" class="feedback"></div>
            `;

            card.innerHTML = contentHTML;
            container.appendChild(card);
        });
    }

    // Функция проверки ответа для каждого вопроса
    window.checkAnswer = function(index) {
        const q = questions[index];
        const feedbackEl = document.getElementById(`feedback-${q.id}`);
        let isCorrect = false;
        let answered = false;

        if (q.type === 'radio') {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected) {
                answered = true;
                if (parseInt(selected.value) === q.correctIndex) {
                    isCorrect = true;
                }
            } else {
                alert('Пожалуйста, выберите вариант ответа.');
                return;
            }
        } else if (q.type === 'text') {
            const inputEl = document.getElementById(`input-q${q.id}`);
            const val = inputEl.value.trim().toLowerCase();
            if (val !== '') {
                answered = true;
                // Сравниваем с учетом возможных пробелов и замен запятой на точку
                const normalizedVal = val.replace(/\s+/g, '').replace(',', '.');
                isCorrect = q.answers.some(ans => {
                    const normalizedAns = ans.replace(/\s+/g, '').replace(',', '.').toLowerCase();
                    return normalizedVal === normalizedAns;
                });
            } else {
                alert('Пожалуйста, введите ответ.');
                return;
            }
        }

        if (answered) {
            userAnswers[index] = isCorrect;
            
            if (isCorrect) {
                feedbackEl.textContent = 'Верно! Отличная работа.';
                feedbackEl.className = 'feedback correct';
            } else {
                feedbackEl.textContent = 'Неверно. Попробуйте еще раз или переходите к следующему вопросу.';
                feedbackEl.className = 'feedback incorrect';
            }
            
            // После каждой попытки можно изменить ответ и проверить его снова.
            // Общий результат можно пересчитать по последним проверенным ответам.
            document.getElementById('result-display').style.display = 'none';
        }
    };

    // Функция подсчета общего результата
    document.getElementById('final-btn').addEventListener('click', () => {
        let answeredCount = 0;
        let currentScore = 0;

        userAnswers.forEach(ans => {
            if (ans !== null) answeredCount++;
            if (ans === true) currentScore++;
        });

        if (answeredCount < questions.length) {
            const confirmMsg = `Вы ответили только на ${answeredCount} из ${questions.length} вопросов. Уверены, что хотите завершить?`;
            if (!confirm(confirmMsg)) {
                return;
            }
        }

        const resultEl = document.getElementById('result-display');
        const percentage = Math.round((currentScore / questions.length) * 100);
        
        let gradeText = '';
        if (percentage >= 90) gradeText = 'Отлично! Вы превосходно усвоили материал.';
        else if (percentage >= 70) gradeText = 'Хорошо! Твердые знания, но есть что повторить.';
        else if (percentage >= 50) gradeText = 'Удовлетворительно. Рекомендуется повторить правила.';
        else gradeText = 'Нужно еще потренироваться. Повторите главу 1 учебника.';

        resultEl.innerHTML = `
            Ваш результат: <span style="color: var(--primary); font-size: 2rem;">${currentScore} из ${questions.length}</span><br>
            <span style="font-size: 1.2rem; color: var(--text-muted); display: block; margin-top: 10px;">${percentage}% правильных ответов</span>
            <p style="margin-top: 20px; font-weight: normal; font-size: 1.1rem;">${gradeText}</p>
        `;
        resultEl.style.display = 'block';

        // Скроллим к результату
        resultEl.scrollIntoView({ behavior: 'smooth' });
        

    });

    // Запуск рендера при загрузке
    renderQuestions();

</script>

</body>
</html>
