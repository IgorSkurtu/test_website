<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Задачи на части (5 класс)</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
            --success: #10B981;
            --error: #EF4444;
            --accent: #EEF2FF;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .header p {
            font-size: 1.1em;
            color: #64748B;
        }

        .section-title {
            color: var(--text);
            font-size: 1.8em;
            margin: 50px 0 25px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--primary);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2em;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }

        .problem-text {
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        /* Solution Steps */
        .solution {
            background-color: var(--accent);
            padding: 16px 20px;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
        }

        .solution p {
            margin: 8px 0;
        }

        /* Task Inputs */
        .task-control {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
            background-color: #F1F5F9;
            padding: 15px;
            border-radius: 8px;
        }

        input[type="number"] {
            padding: 10px 15px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            width: 140px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        button.check-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.check-btn:hover {
            background-color: var(--primary-hover);
        }

        .feedback {
            font-weight: bold;
            font-size: 1.1em;
            margin-left: 10px;
        }

        .correct { color: var(--success); }
        .error { color: var(--error); }

        /* Final Check */
        .final-section {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 50px;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 2px dashed var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .final-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        .final-btn:hover {
            background-color: #059669;
        }

        .final-btn:active {
            transform: scale(0.98);
        }

        #final-result {
            margin-top: 25px;
            font-size: 1.4em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
            </svg>
            Решение задач на части
        </h1>
        <p>Математика, 5 класс. Поиск чисел по их сумме или разности и кратному отношению.</p>
    </div>

    <!-- Разбор примеров -->
    <h2 class="section-title">Разбор примеров</h2>
    <div id="section-examples"></div>

    <!-- Самостоятельное решение -->
    <h2 class="section-title">Самостоятельное решение</h2>
    <div id="section-tasks">
        <div id="tasks-container"></div>
        
        <div class="final-section">
            <button class="final-btn" onclick="checkAllTasks()">Завершить тест и узнать результат</button>
            <div id="final-result"></div>
        </div>
    </div>
</div>

<script>
    // --- ДАННЫЕ ПРИМЕРОВ ---
    const examplesData = [
        {
            title: "Пример 1 (Сумма и кратное отношение)",
            text: "В магазине за день продали 18 ноутбуков и консолей, причём ноутбуков в 2 раза больше, чем консолей. Сколько продано консолей?",
            steps: [
                "Пусть количество консолей составляет 1 часть.",
                "Тогда количество ноутбуков составляет 2 части (так как их в 2 раза больше).",
                "Всего продано: 1 + 2 = 3 части.",
                "На 3 части приходится 18 устройств. Значит, на 1 часть приходится: 18 : 3 = 6 (консолей).",
                "<strong>Ответ: 6 консолей.</strong>"
            ]
        },
        {
            title: "Пример 2 (Сумма и кратное отношение)",
            text: "На кондитерской фабрике «Слодыч» масса двух разных пакетов овсяного печенья равна 1650 г, причём масса одного из них в 2 раза больше массы другого. Какова масса каждого пакета печенья?",
            steps: [
                "Пусть масса меньшего пакета составляет 1 часть.",
                "Тогда масса большего пакета — 2 части.",
                "Общая масса: 1 + 2 = 3 части.",
                "На 3 части приходится 1650 г. Масса меньшего пакета (1 часть): 1650 : 3 = 550 г.",
                "Масса большего пакета: 550 &middot; 2 = 1100 г.",
                "<strong>Ответ: 550 г и 1100 г.</strong>"
            ]
        },
        {
            title: "Пример 3 (Разность и кратное отношение)",
            text: "В кружке по географии занимается в 3 раза меньше учащихся, чем в кружке по математике. Сколько всего учащихся занимается в этих кружках, если в кружке по географии на 16 учащихся меньше, чем по математике?",
            steps: [
                "Пусть географы составляют 1 часть.",
                "Тогда математики составляют 3 части.",
                "Разница между ними: 3 - 1 = 2 части.",
                "По условию эта разница равна 16 учащимся. Значит, 1 часть (географы) = 16 : 2 = 8 учащихся.",
                "Всего частей: 1 + 3 = 4 части. Всего учащихся: 8 &middot; 4 = 32.",
                "<strong>Ответ: 32 учащихся.</strong>"
            ]
        },
        {
            title: "Пример 4 (Разность и кратное отношение)",
            text: "В палаточном лагере двухместных палаток в 4 раза меньше, чем четырёхместных. Сколько было палаток каждого вида, если четырёхместных палаток было на 12 больше?",
            steps: [
                "Пусть количество двухместных палаток — 1 часть.",
                "Тогда четырёхместных — 4 части.",
                "Разница: 4 - 1 = 3 части.",
                "На 3 части приходится 12 палаток. Значит, 1 часть = 12 : 3 = 4 (двухместные палатки).",
                "Четырёхместных палаток: 4 &middot; 4 = 16.",
                "<strong>Ответ: 4 двухместные и 16 четырёхместных.</strong>"
            ]
        },
        {
            title: "Пример 5 (Сумма и кратное отношение)",
            text: "Для офиса купили 56 папок красного и зелёного цвета. Сколько купили папок красного цвета, если папок зелёного цвета в 6 раз меньше?",
            steps: [
                "Пусть зелёные папки — 1 часть.",
                "Тогда красные папки — 6 частей.",
                "Всего: 1 + 6 = 7 частей.",
                "На 7 частей приходится 56 папок. 1 часть (зелёные) = 56 : 7 = 8.",
                "Красных папок: 8 &middot; 6 = 48.",
                "<strong>Ответ: 48 красных папок.</strong>"
            ]
        },
        {
            title: "Пример 6 (Разность и кратное отношение)",
            text: "Одно число больше другого на 144. Меньшее из чисел в 13 раз меньше большего. Чему равно каждое из чисел?",
            steps: [
                "Пусть меньшее число — 1 часть.",
                "Тогда большее число — 13 частей.",
                "Разность: 13 - 1 = 12 частей.",
                "На 12 частей приходится 144. Меньшее число (1 часть): 144 : 12 = 12.",
                "Большее число: 12 &middot; 13 = 156.",
                "<strong>Ответ: 12 и 156.</strong>"
            ]
        },
        {
            title: "Пример 7 (Сумма и кратное отношение)",
            text: "За неделю легкоатлет пробежал две длинные дистанции, всего 18 км. В воскресенье он пробежал в 2 раза больше километров, чем в среду. Сколько километров он пробежал в каждый из дней?",
            steps: [
                "Пусть километры в среду — 1 часть.",
                "Тогда километры в воскресенье — 2 части.",
                "Всего: 1 + 2 = 3 части.",
                "На 3 части приходится 18 км. 1 часть = 18 : 3 = 6 км (в среду).",
                "В воскресенье: 6 &middot; 2 = 12 км.",
                "<strong>Ответ: 6 км и 12 км.</strong>"
            ]
        },
        {
            title: "Пример 8 (Разность и кратное отношение)",
            text: "Для сборки электронных схем купили реле и датчики наклона. Датчиков наклона оказалось в 4 раза больше, чем реле. Сколько датчиков наклона купили, если их на 21 больше, чем реле?",
            steps: [
                "Пусть количество реле — 1 часть.",
                "Тогда датчиков наклона — 4 части.",
                "Разница: 4 - 1 = 3 части.",
                "На 3 части приходится 21 деталь. 1 часть (реле) = 21 : 3 = 7.",
                "Датчиков наклона: 7 &middot; 4 = 28.",
                "<strong>Ответ: 28 датчиков наклона.</strong>"
            ]
        },
        {
            title: "Пример 9 (Разность и кратное отношение)",
            text: "Для лазерной резки картона подготовили макет: дисков в 2 раза меньше, чем колец. Сколько дисков и колец вырезали, если колец было на 15 больше, чем дисков?",
            steps: [
                "Пусть количество дисков — 1 часть.",
                "Тогда количество колец — 2 части.",
                "Разница: 2 - 1 = 1 часть.",
                "По условию эта разница равна 15. Значит, 1 часть (диски) = 15.",
                "Колец: 15 &middot; 2 = 30.",
                "<strong>Ответ: 15 дисков и 30 колец.</strong>"
            ]
        },
        {
            title: "Пример 10 (Сумма и кратное отношение)",
            text: "При настройке контроллера мотора изменили два параметра, их сумма составила 60 единиц. Значение первого параметра оказалось в 5 раз меньше значения второго. Чему равны эти значения?",
            steps: [
                "Пусть первый параметр — 1 часть.",
                "Тогда второй параметр — 5 частей.",
                "Всего: 1 + 5 = 6 частей.",
                "На 6 частей приходится 60 единиц. 1 часть (первый параметр) = 60 : 6 = 10.",
                "Второй параметр: 10 &middot; 5 = 50.",
                "<strong>Ответ: 10 и 50.</strong>"
            ]
        }
    ];

    // --- ДАННЫЕ ЗАДАЧ ДЛЯ САМОСТОЯТЕЛЬНОГО РЕШЕНИЯ ---
    const tasksData = [
        { q: "Сумма двух чисел равна 24, одно из них в 2 раза больше другого. Найдите меньшее число.", a: 8 },
        { q: "Разность двух чисел равна 18, одно из них в 3 раза больше другого. Найдите большее число.", a: 27 },
        { q: "В лаборатории неразрушающего контроля тестировали приборы двух типов. Всего их 45, причём приборов первого типа в 4 раза меньше, чем второго. Сколько приборов второго типа?", a: 36 },
        { q: "На 3D принтере напечатали детали: кубы и пирамиды. Кубов в 4 раза меньше, чем пирамид, и их на 24 меньше. Сколько напечатали кубов?", a: 8 },
        { q: "Сумма двух чисел равна 60, одно в 5 раз больше другого. Найдите меньшее число.", a: 10 },
        { q: "Разность двух чисел равна 40, одно в 5 раз меньше другого. Найдите большее число.", a: 50 },
        { q: "Длина одного маршрута для пробежки на 8 км больше другого. Меньший маршрут в 3 раза короче большего. Какова длина большего маршрута (в км)?", a: 12 },
        { q: "Папок зелёного и красного цвета всего 42. Зелёных в 6 раз меньше. Сколько красных папок?", a: 36 },
        { q: "Разность двух чисел равна 72. Меньшее число в 13 раз меньше большего. Найдите меньшее число.", a: 6 },
        { q: "За день на фабрике выпустили 150 кг печенья. Овсяного в 2 раза больше, чем сахарного. Сколько килограммов овсяного печенья выпустили?", a: 100 },
        { q: "Билет на поезд в один город стоит в 3 раза меньше, чем в другой. Разница в цене составляет 20 рублей. Сколько стоит более дешёвый билет?", a: 10 },
        { q: "В алгоритме команд управления в 7 раз больше, чем команд чтения. Всего их 64. Сколько команд чтения?", a: 8 },
        { q: "Сумма двух чисел равна 81, одно из них в 8 раз больше другого. Найдите меньшее число.", a: 9 },
        { q: "Разность двух чисел равна 35, одно из них в 8 раз меньше другого. Найдите большее число.", a: 40 },
        { q: "Сумма двух чисел равна 100, одно из них в 9 раз больше другого. Найдите большее число.", a: 90 },
        { q: "Разность двух чисел равна 56, одно из них в 9 раз меньше другого. Найдите меньшее число.", a: 7 },
        { q: "Сумма двух чисел равна 110, одно из них в 10 раз больше другого. Найдите меньшее число.", a: 10 },
        { q: "В палаточном лагере четырёхместных палаток в 2 раза больше, чем двухместных. Всего в лагере 18 палаток. Сколько четырёхместных?", a: 12 },
        { q: "На кружок по математике ходит на 16 учеников больше, чем на кружок по географии. Географов в 3 раза меньше. Сколько всего учеников в двух кружках?", a: 32 },
        { q: "Для сборки схемы использовали микроконтроллеры и реле, всего 144 детали. Реле в 11 раз больше, чем контроллеров. Сколько реле купили?", a: 132 }
    ];

    let taskStates = new Array(tasksData.length).fill(false);

    // --- ИНИЦИАЛИЗАЦИЯ И РЕНДЕР ---
    function init() {
        renderExamples();
        renderTasks();
    }

    function renderExamples() {
        const container = document.getElementById('section-examples');
        examplesData.forEach((ex, index) => {
            const stepsHtml = ex.steps.map(step => `<p>${step}</p>`).join('');
            const card = `
                <div class="card">
                    <div class="card-title">${ex.title}</div>
                    <div class="problem-text">${ex.text}</div>
                    <div class="solution">
                        <strong>Разбор:</strong>
                        ${stepsHtml}
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    function renderTasks() {
        const container = document.getElementById('tasks-container');
        tasksData.forEach((task, index) => {
            const card = `
                <div class="card">
                    <div class="card-title">Задание ${index + 1}</div>
                    <div class="problem-text">${task.q}</div>
                    <div class="task-control">
                        <label for="task-${index}">Ответ:</label>
                        <input type="number" id="task-${index}" placeholder="Введите число">
                        <button class="check-btn" onclick="checkAnswer(${index})">Проверить</button>
                        <span id="feedback-${index}" class="feedback"></span>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    // --- ЛОГИКА ПРОВЕРКИ ---
    function checkAnswer(index) {
        const input = document.getElementById(`task-${index}`);
        const feedback = document.getElementById(`feedback-${index}`);
        const userValue = parseInt(input.value, 10);
        const correctValue = tasksData[index].a;

        if (isNaN(userValue)) {
            feedback.textContent = "Пожалуйста, введите число.";
            feedback.className = "feedback";
            return;
        }

        if (userValue === correctValue) {
            feedback.innerHTML = "✓ Верно!";
            feedback.className = "feedback correct";
            input.style.borderColor = "var(--success)";
            input.style.backgroundColor = "#ECFDF5";
            taskStates[index] = true;
        } else {
            feedback.innerHTML = "✗ Ошибка. Попробуйте ещё раз.";
            feedback.className = "feedback error";
            input.style.borderColor = "var(--error)";
            input.style.backgroundColor = "#FEF2F2";
            taskStates[index] = false;
        }
    }

    function checkAllTasks() {
        const correctCount = taskStates.filter(state => state === true).length;
        const totalCount = tasksData.length;
        const resultDiv = document.getElementById('final-result');
        
        if (correctCount === totalCount) {
            resultDiv.style.color = "var(--success)";
            resultDiv.innerHTML = `Поздравляем! Вы решили верно ${correctCount} из ${totalCount} заданий! 🏆`;
        } else {
            resultDiv.style.color = "var(--text)";
            resultDiv.innerHTML = `Ваш результат: <strong>${correctCount} из ${totalCount}</strong> правильно.<br><span style="font-size: 0.8em; font-weight: normal;">Проверьте задания с ошибками или пустые поля.</span>`;
        }
    }

    // Запуск
    window.onload = init;
</script>

</body>
</html>
