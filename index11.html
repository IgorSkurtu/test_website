<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер для 8 класса</title>
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a53d0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --success-color: #2a9d8f;
            --error-color: #e63946;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.4rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 1.1rem;
        }

        .subject-section {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        .subject-title {
            font-size: 1.6rem;
            color: #1d3557;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: inline-block;
        }

        .question-item {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f3f5;
        }

        .question-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-text {
            font-weight: 500;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        input.correct-input {
            border-color: var(--success-color);
            background-color: #f0fdf4;
        }

        input.incorrect-input {
            border-color: var(--error-color);
            background-color: #fff1f2;
        }

        button {
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .feedback {
            width: 100%;
            margin-top: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success-color);
        }

        .feedback.incorrect {
            color: var(--error-color);
        }

        .check-all-container {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .check-all-btn {
            font-size: 1.2rem;
            padding: 16px 48px;
            background-color: var(--success-color);
        }

        .check-all-btn:hover {
            background-color: #21867a;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: modalPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPopIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #1d3557;
        }

        .modal-text {
            font-size: 1.25rem;
            margin-bottom: 30px;
            color: #495057;
        }

        .close-btn {
            background-color: #6c757d;
            width: 100%;
        }

        .close-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Тренажер для 8 класса</h1>
        <p class="subtitle">Алгебра, Геометрия и Физика (30 заданий)</p>
    </header>

    <main id="quiz-container">
        <!-- Секция Алгебры -->
        <section class="subject-section">
            <h2 class="subject-title">Алгебра</h2>
            <div class="question-list" id="algebra-list"></div>
        </section>

        <!-- Секция Геометрии -->
        <section class="subject-section">
            <h2 class="subject-title">Геометрия</h2>
            <div class="question-list" id="geometry-list"></div>
        </section>

        <!-- Секция Физики -->
        <section class="subject-section">
            <h2 class="subject-title">Физика</h2>
            <div class="question-list" id="physics-list"></div>
        </section>

        <!-- Кнопка общей проверки -->
        <div class="check-all-container">
            <button class="check-all-btn" onclick="checkAll()">Общая проверка</button>
        </div>
    </main>
</div>

<div class="modal-overlay" id="resultModal">
    <div class="modal-content">
        <h2 class="modal-title">Результаты</h2>
        <p class="modal-text" id="modalScoreText"></p>
        <button class="close-btn" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
    const quizData = [
        // Алгебра
        { 
            subject: 'algebra', 
            text: '1. Решите уравнение: x² - 7x + 12 = 0. (Ответ запишите через точку с запятой по возрастанию).', 
            answer: '3;4',
            acceptable: ['3;4', '3; 4']
        },
        { 
            subject: 'algebra', 
            text: '2. Найдите дискриминант уравнения 2x² - 5x + 3 = 0.', 
            answer: '1' 
        },
        { 
            subject: 'algebra', 
            text: '3. Вычислите значение выражения √(64 * 0.25).', 
            answer: '4' 
        },
        { 
            subject: 'algebra', 
            text: '4. Упростите выражение: (√7 - 3)(√7 + 3).', 
            answer: '-2' 
        },
        { 
            subject: 'algebra', 
            text: '5. Решите уравнение: x² = 121. (Ответ через точку с запятой по возрастанию).', 
            answer: '-11;11',
            acceptable: ['-11;11', '-11; 11']
        },
        { 
            subject: 'algebra', 
            text: '6. В вегетарианском кафе за день продали яблочных пирогов в 2 раза больше, чем вишневых. Всего продали 42 пирога. Сколько вишневых пирогов продали?', 
            answer: '14' 
        },
        { 
            subject: 'algebra', 
            text: '7. Найдите значение выражения 2⁻³ * 2⁵.', 
            answer: '4' 
        },
        { 
            subject: 'algebra', 
            text: '8. Представьте число 0.00045 в стандартном виде. Каков порядок этого числа?', 
            answer: '-4' 
        },
        { 
            subject: 'algebra', 
            text: '9. Решите уравнение: 3x² - 27 = 0. (Ответ через точку с запятой по возрастанию).', 
            answer: '-3;3',
            acceptable: ['-3;3', '-3; 3']
        },
        { 
            subject: 'algebra', 
            text: '10. Вычислите √(144 / 9).', 
            answer: '4' 
        },
        
        // Геометрия
        { 
            subject: 'geometry', 
            text: '11. В прямоугольном треугольнике ADC угол C прямой. Угол DAC равен 15 градусам. Найдите величину угла ADC в градусах.', 
            answer: '75' 
        },
        { 
            subject: 'geometry', 
            text: '12. В прямоугольном треугольнике катеты равны 5 и 12. Найдите гипотенузу.', 
            answer: '13' 
        },
        { 
            subject: 'geometry', 
            text: '13. Найдите площадь прямоугольника со сторонами 8 и 15.', 
            answer: '120' 
        },
        { 
            subject: 'geometry', 
            text: '14. Найдите сумму внутренних углов выпуклого шестиугольника (в градусах).', 
            answer: '720' 
        },
        { 
            subject: 'geometry', 
            text: '15. В параллелограмме один из углов равен 50 градусам. Найдите соседний с ним угол (в градусах).', 
            answer: '130' 
        },
        { 
            subject: 'geometry', 
            text: '16. Найдите длину средней линии трапеции, если ее основания равны 8 и 14.', 
            answer: '11' 
        },
        { 
            subject: 'geometry', 
            text: '17. Сколько диагоналей можно провести в выпуклом пятиугольнике?', 
            answer: '5' 
        },
        { 
            subject: 'geometry', 
            text: '18. Найдите площадь ромба, диагонали которого равны 14 и 10.', 
            answer: '70' 
        },
        { 
            subject: 'geometry', 
            text: '19. Отношение сходственных сторон двух подобных треугольников равно 3. Чему равно отношение их площадей?', 
            answer: '9' 
        },
        { 
            subject: 'geometry', 
            text: '20. Центральный угол окружности равен 110 градусам. Найдите градусную меру вписанного угла, опирающегося на ту же дугу.', 
            answer: '55' 
        },

        // Физика
        { 
            subject: 'physics', 
            text: '21. Какое количество теплоты (в кДж) потребуется для нагревания 3 кг воды на 20 °C? Удельная теплоемкость воды 4200 Дж/(кг·°C).', 
            answer: '252' 
        },
        { 
            subject: 'physics', 
            text: '22. Сколько теплоты (в кДж) нужно затратить, чтобы расплавить 2 кг льда при температуре 0 °C? Удельная теплота плавления льда 333 кДж/кг.', 
            answer: '666' 
        },
        { 
            subject: 'physics', 
            text: '23. Какое количество теплоты (в МДж) выделится при полном сгорании 2 кг каменного угля? Удельная теплота сгорания 30 МДж/кг.', 
            answer: '60' 
        },
        { 
            subject: 'physics', 
            text: '24. При напряжении 220 В сила тока в спирали электроплитки равна 5 А. Каково сопротивление спирали (в Омах)?', 
            answer: '44' 
        },
        { 
            subject: 'physics', 
            text: '25. Два резистора сопротивлением 12 Ом и 18 Ом соединены последовательно. Чему равно их эквивалентное сопротивление (в Омах)?', 
            answer: '30' 
        },
        { 
            subject: 'physics', 
            text: '26. Два резистора сопротивлением 40 Ом каждый соединены параллельно. Найдите их эквивалентное сопротивление (в Омах).', 
            answer: '20' 
        },
        { 
            subject: 'physics', 
            text: '27. Какова мощность электрического чайника (в Вт), если при напряжении 220 В сила тока в нагревательном элементе равна 10 А?', 
            answer: '2200' 
        },
        { 
            subject: 'physics', 
            text: '28. Какое количество теплоты (в Дж) выделит проводник сопротивлением 15 Ом за 10 секунд при силе тока 2 А?', 
            answer: '600' 
        },
        { 
            subject: 'physics', 
            text: '29. Какой электрический заряд (в Кл) проходит через поперечное сечение проводника за 2 минуты при силе тока 0.5 А?', 
            answer: '60' 
        },
        { 
            subject: 'physics', 
            text: '30. Определите сопротивление (в Омах) медного провода длиной 100 м и площадью поперечного сечения 1.7 мм². Удельное сопротивление меди 0.017 Ом·мм²/м.', 
            answer: '1' 
        }
    ];

    function renderQuiz() {
        const containers = {
            algebra: document.getElementById('algebra-list'),
            geometry: document.getElementById('geometry-list'),
            physics: document.getElementById('physics-list')
        };

        quizData.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question-item';
            div.innerHTML = `
                <div class="question-text">${q.text}</div>
                <div class="controls">
                    <input type="text" id="input_${index}" placeholder="Введите ответ..." autocomplete="off">
                    <button onclick="checkAnswer(${index})">Проверить</button>
                </div>
                <div id="feedback_${index}" class="feedback"></div>
            `;
            containers[q.subject].appendChild(div);
            
            // Обработчик клавиши Enter для удобства
            const inputField = div.querySelector('input');
            inputField.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkAnswer(index);
                }
            });
        });
    }

    function checkAnswer(index) {
        const q = quizData[index];
        const inputEl = document.getElementById('input_' + index);
        const feedbackEl = document.getElementById('feedback_' + index);
        
        // Нормализация введенного значения (удаление пробелов, замена запятой на точку, приведение к нижнему регистру)
        let val = inputEl.value.trim().toLowerCase().replace(/\s+/g, '').replace(/,/g, '.');
        let isCorrect = false;

        // Если у вопроса есть массив допустимых форматов ответа
        if (q.acceptable) {
            let normalizedAcceptable = q.acceptable.map(a => a.toLowerCase().replace(/\s+/g, '').replace(/,/g, '.'));
            isCorrect = normalizedAcceptable.includes(val);
        } else {
            // Иначе сверяем строго с главным ответом
            let ref = q.answer.toLowerCase().replace(/\s+/g, '').replace(/,/g, '.');
            isCorrect = (val === ref);
        }

        // Обновление интерфейса (цвет рамки инпута и вывод текста)
        if (isCorrect) {
            feedbackEl.textContent = "Верно!";
            feedbackEl.className = "feedback correct";
            inputEl.className = "correct-input";
        } else {
            feedbackEl.textContent = "Неверно. Правильный ответ: " + q.answer;
            feedbackEl.className = "feedback incorrect";
            inputEl.className = "incorrect-input";
        }

        return isCorrect;
    }

    function checkAll() {
        let score = 0;
        quizData.forEach((_, index) => {
            const isCorrect = checkAnswer(index);
            if (isCorrect) {
                score++;
            }
        });
        showResultModal(score, quizData.length);
    }

    function showResultModal(score, total) {
        const modal = document.getElementById('resultModal');
        const scoreText = document.getElementById('modalScoreText');
        
        let message = '';
        const percentage = score / total;

        if (percentage === 1) {
            message = 'Идеально! Вы решили абсолютно всё без ошибок! 🏆';
        } else if (percentage >= 0.75) {
            message = 'Отличная работа! Большинство заданий выполнено верно. 🌟';
        } else if (percentage >= 0.5) {
            message = 'Неплохо, но вам есть куда расти. Повторите теорию и попробуйте еще раз! 📚';
        } else {
            message = 'Кажется, материал нужно повторить основательно. Не сдавайтесь! 💪';
        }

        scoreText.innerHTML = `Ваш результат: <strong>${score}</strong> из <strong>${total}</strong><br><br>${message}`;
        modal.classList.add('active');
    }

    function closeModal() {
        const modal = document.getElementById('resultModal');
        modal.classList.remove('active');
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', renderQuiz);
</script>

</body>
</html>
